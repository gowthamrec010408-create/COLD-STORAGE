<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — QORA TECH Control Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="auth-page-wrapper">
    <div class="auth-form-card" style="border-top: 4px solid var(--brand-purple);">
      <!-- Header -->
      <div class="text-center mb-6">
        <div class="flex items-center justify-center gap-2 mb-3">
          <img src="assets/logo.png" alt="QORA TECH Logo" class="qora-brand-img" style="width: 36px; height: 36px;" />
          <div class="text-left">
            <span class="font-bold text-sm block">QORA <span class="text-purple">ADMIN</span></span>
            <span class="text-3xs text-muted tracking-wider uppercase block">CONTROL CENTER</span>
          </div>
        </div>
        <h1 class="auth-page-title">Administrator Login</h1>
        <p class="auth-page-subtitle">Elevated permissions for user governance & facility calibration</p>
      </div>

      <!-- Error Message Banner -->
      <div id="auth-error-banner" class="hidden mb-4 p-3 rounded-lg border border-rose bg-rose-light text-xs text-rose font-bold text-center"></div>

      <!-- Admin Form -->
      <form id="admin-login-form" class="space-y-4">
        <div class="form-group">
          <label for="admin-identifier">Admin ID or Email</label>
          <div class="input-with-icon">
            <i data-lucide="shield"></i>
            <input type="text" id="admin-identifier" class="form-control" placeholder="admin@qoratech.io" value="admin@qoratech.io" required />
          </div>
        </div>

        <div class="form-group">
          <label for="admin-password">Master Password</label>
          <div class="input-with-icon">
            <i data-lucide="key"></i>
            <input type="password" id="admin-password" class="form-control" placeholder="••••••••" value="admin123" required />
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" class="btn btn-admin w-full py-3" id="btn-submit-admin">
            <i data-lucide="lock"></i> ACCESS ADMIN DASHBOARD
          </button>
        </div>
      </form>

      <!-- Bottom Links -->
      <div class="mt-6 pt-4 border-t border-glass text-center text-xs text-muted space-y-3">
        <div>
          <span>Are you a storage user/farmer?</span>
          <a href="login.html" class="auth-nav-link ml-1">USER LOGIN</a>
        </div>
        <div>
          <a href="index.html" class="text-dim hover:underline flex items-center justify-center gap-1">
            <i data-lucide="arrow-left" class="icon-2xs"></i> Back to Home
          </a>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { authService } from './js/auth.js';
    import { initializeFirebase } from './js/config/firebase-config.js';

    if (window.lucide) window.lucide.createIcons();
    await initializeFirebase();

    const form = document.getElementById('admin-login-form');
    const errorBanner = document.getElementById('auth-error-banner');

    function showError(msg) {
      if (errorBanner) {
        errorBanner.textContent = msg;
        errorBanner.classList.remove('hidden');
      }
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('admin-identifier').value.trim();
      const pass = document.getElementById('admin-password').value;

      try {
        if (errorBanner) errorBanner.classList.add('hidden');
        const user = await authService.loginAdmin(id, pass);
        window.location.href = 'admin.html';
      } catch (err) {
        showError(err.message || 'Administrator authentication failed.');
      }
    };
  </script>
</body>
</html>
